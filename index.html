<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anything 4 u</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; color: #e8ecf5; }
  body { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; }
  pre { margin: 0; font-family: ui-monospace, "Courier New", monospace; line-height: 1.2; white-space: pre; }
  button { display: none; font: inherit; padding: 10px 22px; border-radius: 999px; border: 1px solid #5a6485; background: transparent; color: #e8ecf5; }
</style>
</head>
<body>
<pre id="screen"></pre>
<button id="replay">Putar lagi</button>
<script>
const W = 70, H = 22, FRAME_MS = 40;
const FLAKES = ["·", "·", "·", ".", ".", "˙", "°", "*", "+"];
const TITLE = ["⋆꙳•❅*‧ ‧*❆ ₊⋆", "Anything 4 u", "LANY", "⋆꙳•❅*‧ ‧*❆ ₊⋆"];
const CLOSING = ["rr monza"];

const screen = document.getElementById("screen");
const replayBtn = document.getElementById("replay");
let snow, runId = 0, lyrics = [];

const sleep = ms => new Promise(r => setTimeout(r, ms));
const blank = () => Array.from({ length: H }, () => Array(W).fill(" "));

function fit() {
  const size = Math.min(18, (window.innerWidth * 0.96) / (W * 0.6));
  screen.style.fontSize = size + "px";
}
window.addEventListener("resize", fit);

function put(frame, row, text) {
  const start = Math.floor((W - text.length) / 2);
  [...text].forEach((ch, i) => {
    const c = start + i;
    if (row >= 0 && row < H && c >= 0 && c < W) frame[row][c] = ch;
  });
}

function stepSnow() {
  for (let r = H - 1; r > 0; r--)
    for (let c = 0; c < W; c++)
      if (snow[r - 1][c] !== " " && Math.random() < 0.09) {
        snow[r][c] = snow[r - 1][c];
        snow[r - 1][c] = " ";
      }
  for (let c = 0; c < W; c++) if (Math.random() < 0.10) snow[H - 1][c] = " ";
  for (let c = 0; c < W; c++)
    if (snow[0][c] === " " && Math.random() < 0.010)
      snow[0][c] = FLAKES[Math.floor(Math.random() * FLAKES.length)];
}

function draw(frame) { screen.textContent = frame.map(r => r.join("")).join("\n"); }

function snowFrame(text) {
  stepSnow();
  const frame = snow.map(r => r.slice());
  const mid = Math.floor(H * 3 / 5);
  for (const d of [-1, 0, 1]) frame[mid + d] = Array(W).fill(" ");
  if (text) put(frame, mid, text);
  return frame;
}

function staticFrame(lines) {
  const frame = blank();
  const top = Math.floor((H - lines.length) / 2);
  lines.forEach((t, i) => put(frame, top + i, t));
  return frame;
}

async function showSnow(text, seconds, id) {
  const end = performance.now() + seconds * 1000;
  while (performance.now() < end) {
    if (id !== runId) return false;
    draw(snowFrame(text));
    await sleep(FRAME_MS);
  }
  return true;
}

async function loadLyrics() {
  try {
    const res = await fetch("lyrics.txt", { cache: "no-store" });
    if (!res.ok) throw new Error("not found");
    const text = await res.text();
    lyrics = text.split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l && !l.startsWith("#") && l.includes("|"))
      .map(l => {
        const i = l.lastIndexOf("|");
        return [l.slice(0, i).trim(), parseFloat(l.slice(i + 1)) || 3];
      });
  } catch (e) { lyrics = null; }
}

async function play() {
  const id = ++runId;
  replayBtn.style.display = "none";
  snow = blank();
  if (lyrics === null) {
    screen.textContent = "File lyrics.txt belum ada di repo.";
    return;
  }
  draw(staticFrame(TITLE));
  await sleep(3000);
  if (id !== runId) return;
  if (!(await showSnow("", 4, id))) return;
  for (const [line, secs] of lyrics)
    if (!(await showSnow(line, secs, id))) return;
  draw(staticFrame(CLOSING));
  await sleep(3500);
  if (id !== runId) return;
  replayBtn.style.display = "inline-block";
}

replayBtn.addEventListener("click", play);
fit();
loadLyrics().then(play);
</script>
</body>
</html>
